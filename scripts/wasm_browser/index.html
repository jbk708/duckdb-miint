<!doctype html>
<html><head><meta charset="utf-8"><title>miint WASM browser check</title></head>
<body>
<script type="module">
// The playground's boot sequence (the-miint.github.io, docs/playground.md):
// same duckdb-wasm version, selectBundle(getJsDelivrBundles()), a Blob worker,
// instantiate(mainModule, pthreadWorker), open({allowUnsignedExtensions}).
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev64.0/+esm';

let conn = null;

const withTimeout = (p, ms, what) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error(`timed out after ${ms} ms: ${what}`)), ms))]);

const fmt = v => (v === null || v === undefined ? 'NULL' : String(v));

// The extension is built for the eh bundle (wasm_eh), which the playground gets
// on a page without cross-origin isolation; any other bundle is a different test.
async function boot() {
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  if (!/\/duckdb-eh\.wasm$/.test(bundle.mainModule)) throw new Error(`expected eh bundle, got ${bundle.mainModule}`);
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), new Worker(workerUrl));
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  await db.open({ allowUnsignedExtensions: true });
  conn = await db.connect();
  const platform = (await conn.query('PRAGMA platform')).toArray()[0].platform;
  if (platform !== 'wasm_eh') throw new Error(`expected platform wasm_eh, got ${platform}`);
  const v = (await conn.query('SELECT library_version, source_id FROM pragma_version()')).toArray()[0];
  return { ok: true, mainModule: bundle.mainModule, platform, version: `${v.library_version} @ ${v.source_id}` };
}

window.__boot = async () => {
  try {
    return await withTimeout(boot(), 120000, 'boot');
  } catch (e) {
    return { ok: false, error: String(e && e.message || e) };
  }
};

window.__load = async url => {
  try {
    await withTimeout(conn.query(`LOAD '${url}'`), 120000, 'LOAD');
    return { ok: true, version: fmt((await conn.query('SELECT miint_version() AS v')).toArray()[0].v) };
  } catch (e) {
    return { ok: false, error: String(e && e.message || e) };
  }
};

// Run one step and return the first cell of its first row. After an error, say
// whether the database still answers, so the driver can stop if it does not.
window.__step = async sql => {
  try {
    const t = await withTimeout(conn.query(sql), 180000, sql.slice(0, 60));
    const rows = t.toArray();
    const col = t.schema.fields.length ? t.schema.fields[0].name : null;
    return { ok: true, value: rows.length && col !== null ? fmt(rows[0][col]) : null };
  } catch (e) {
    let alive = true;
    try { await withTimeout(conn.query('SELECT 1'), 20000, 'liveness'); } catch { alive = false; }
    return { ok: false, error: String(e && e.message || e), alive };
  }
};
window.__ready = true;
</script>
</body></html>
